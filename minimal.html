<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINIMAL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }
    
    /* Top Navigation Bar */
    .navbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .btn-secondary { background: #374151; }
    .btn-secondary:hover { background: #4b5563; }

    /* Browser Viewport */
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <input type="text" id="urlInput" placeholder="Search Bing or enter a URL (e.g. wikipedia.org)..." onkeydown="if(event.key==='Enter') loadPage()">
    <button onclick="loadPage()">Go</button>
    <button class="btn-secondary" onclick="openNewTab()" title="Use if a site refuses to connect">Open in Tab ↗</button>
  </div>

  <iframe id="browserFrame" src="https://bing.com"></iframe>

  <script>
    let currentUrl = "https://bing.com";

    function formatUrl(input) {
      input = input.trim();
      if (!input) return "";
      
      // If it looks like a URL (has a dot and no spaces)
      if (input.includes(".") && !input.includes(" ")) {
        return input.startsWith("http://") || input.startsWith("https://") 
          ? input 
          : "https://" + input;
      }
      // Otherwise, treat it as a search query
      return "https://bing.com/search?q=" + encodeURIComponent(input);
    }

    function loadPage() {
      const rawInput = document.getElementById("urlInput").value;
      const formatted = formatUrl(rawInput);
      if (!formatted) return;

      currentUrl = formatted;
      document.getElementById("browserFrame").src = currentUrl;
    }

    function openNewTab() {
      const rawInput = document.getElementById("urlInput").value;
      const target = rawInput ? formatUrl(rawInput) : currentUrl;
      window.open(target, "_blank");
    }
  </script>

</body>
</html>
